<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Генератор Номеров GLOBAL 3.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap');
        
        :root {
            --bg: #09090b; --panel: rgba(24, 24, 27, 0.75); --text: #ffffff;
            --primary: #3b82f6; --creator: linear-gradient(135deg, #ff007a, #7a00ff);
            --common: #a1a1aa; --rare: #4ade80; --epic: #c084fc; --mythic: #f87171; --legendary: #fbbf24;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg); color: var(--text);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1e1e24 0%, #09090b 80%);
        }

        /* Шапка */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: var(--panel); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 50;
        }
        .profile-mini { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 42px; height: 42px; border-radius: 14px; background: var(--primary); display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 18px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);}
        .wallet-amount { font-size: 22px; font-weight: 900; color: #4ade80; }
        
        .badge { font-size: 10px; padding: 3px 8px; border-radius: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-top: 4px; }
        .badge-player { background: #27272a; color: #a1a1aa; }
        .badge-creator { background: var(--creator); color: #fff; box-shadow: 0 0 10px rgba(255, 0, 122, 0.5); animation: pulse 2s infinite; }

        @keyframes pulse { 0% { box-shadow: 0 0 5px rgba(255,0,122,0.5); } 50% { box-shadow: 0 0 15px rgba(122,0,255,0.8); } 100% { box-shadow: 0 0 5px rgba(255,0,122,0.5); } }

        /* Вкладки */
        .tab-content { flex: 1; overflow-y: auto; display: none; padding: 20px; padding-bottom: 100px; }
        .tab-content.active { display: flex; flex-direction: column; align-items: center; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Дизайн номера */
        .plate-wrapper { position: relative; width: 100%; max-width: 380px; }
        .license-plate {
            display: flex; background: #fff; color: #000; border-radius: 12px; height: 90px;
            box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px #000, 0 15px 35px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .plate-main { flex: 2.8; display: flex; justify-content: center; align-items: center; font-size: 56px; font-weight: 800; }
        .plate-main .letters { font-size: 42px; margin: 0 4px; font-weight: 600; }
        .plate-region { flex: 1; border-left: 3px solid #000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding-right: 5px; }
        .region-code { font-size: 38px; font-weight: 800; line-height: 0.9; }
        .rus-box { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 900; margin-top: 4px; }
        .flag { width: 22px; height: 14px; background: linear-gradient(180deg, #fff 33%, #0039a6 33%, #0039a6 66%, #d52b1e 66%); border: 1px solid #000; }

        /* Gacha анимации */
        .gacha-container { margin-top: 50px; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .scrambling { transform: scale(0.9) rotateX(20deg); filter: blur(3px); }
        .reveal-epic { animation: popEpic 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px #000, 0 0 40px var(--epic); }
        .reveal-mythic { animation: popMythic 0.6s forwards; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px #000, 0 0 50px var(--mythic); }
        .reveal-legendary { animation: popLegendary 0.8s forwards; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px #000, 0 0 70px var(--legendary); }

        @keyframes popEpic { 0% { transform: scale(0.5); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes popMythic { 0% { transform: scale(0.5) rotate(-5deg); } 80% { transform: scale(1.15) rotate(5deg); } 100% { transform: scale(1) rotate(0); } }
        @keyframes popLegendary { 0% { transform: scale(0.1) translateY(100px); opacity: 0; } 60% { transform: scale(1.2) translateY(-20px); opacity: 1; } 100% { transform: scale(1) translateY(0); } }

        .rarity-badge { padding: 8px 24px; border-radius: 20px; font-weight: 900; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; margin-top: -15px; margin-bottom: 25px; background: #18181b; border: 2px solid var(--common); z-index: 10; transition: all 0.3s; }
        
        .action-buttons { display: flex; gap: 10px; width: 100%; max-width: 380px; margin-top: 30px; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .action-buttons.visible { opacity: 1; pointer-events: auto; }
        .btn { flex: 1; padding: 18px; border-radius: 16px; font-weight: 900; font-size: 16px; border: none; cursor: pointer; text-transform: uppercase; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn-sell { background: #27272a; color: #fff; border: 1px solid #3f3f46; }
        .btn-keep { background: var(--primary); color: #fff; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4); }
        
        .btn-spin-main { width: 100%; max-width: 380px; padding: 22px; margin-top: auto; margin-bottom: 20px; background: #fff; color: #000; border-radius: 20px; font-weight: 900; font-size: 18px; text-transform: uppercase; border: none; transition: transform 0.1s; box-shadow: 0 10px 30px rgba(255,255,255,0.2); }
        .btn-spin-main:active { transform: translateY(4px); }

        /* Гараж */
        .garage-grid { display: grid; grid-template-columns: 1fr; gap: 15px; width: 100%; max-width: 400px; margin-top: 20px; }
        .garage-item { background: var(--panel); border: 1px solid #27272a; border-radius: 16px; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative;}
        .garage-actions { display: flex; gap: 10px; width: 100%; }
        .btn-g-sell { background: #ef4444; color: white; border: none; padding: 10px; border-radius: 10px; font-weight: bold; flex: 1; }
        .btn-g-equip { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 10px; font-weight: bold; flex: 2; }
        .equipped-label { position: absolute; top: -10px; right: -10px; background: var(--legendary); color: #000; padding: 5px 10px; border-radius: 10px; font-weight: 900; font-size: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transform: rotate(10deg); }

        /* Профиль */
        .profile-card { background: var(--panel); border-radius: 20px; padding: 30px 20px; width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
        .profile-avatar-big { width: 80px; height: 80px; border-radius: 24px; background: var(--primary); display: flex; justify-content: center; align-items: center; font-size: 40px; margin-bottom: 15px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; margin-top: 25px; }
        .stat-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 16px; text-align: center; }
        .stat-val { font-size: 20px; font-weight: 900; color: #fff; }
        .stat-label { font-size: 11px; color: #a1a1aa; text-transform: uppercase; margin-top: 4px; font-weight: 700;}

        /* Топы */
        .top-switcher { display: flex; background: #18181b; border-radius: 12px; padding: 4px; width: 100%; max-width: 400px; margin-bottom: 20px; }
        .top-tab { flex: 1; text-align: center; padding: 10px; font-weight: 800; font-size: 14px; color: #71717a; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .top-tab.active { background: #27272a; color: #fff; }
        .leaderboard-list { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
        .lb-item { display: flex; align-items: center; background: var(--panel); padding: 12px 15px; border-radius: 16px; border: 1px solid #27272a; }
        .lb-item.is-me { border-color: var(--primary); background: rgba(59, 130, 246, 0.1); }
        .lb-rank { font-size: 18px; font-weight: 900; width: 30px; color: #a1a1aa; }
        .lb-rank.r1 { color: #fbbf24; text-shadow: 0 0 10px rgba(251,191,36,0.5); }
        .lb-rank.r2 { color: #d4d4d8; }
        .lb-rank.r3 { color: #b45309; }
        .lb-info { flex: 1; margin-left: 10px; }
        .lb-name { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .lb-val { font-weight: 900; color: #4ade80; }

        /* Навигация */
        nav { position: fixed; bottom: 0; width: 100%; background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 15px 0 25px 0; border-top: 1px solid rgba(255,255,255,0.05); z-index: 100; }
        .nav-item { color: #71717a; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; transition: color 0.3s; }
        .nav-item i { font-size: 22px; }
        .nav-item.active { color: var(--primary); }

        /* Частицы */
        .particle { position: absolute; border-radius: 50%; pointer-events: none; z-index: 100; animation: explode 1s ease-out forwards; }
        @keyframes explode { 0% { transform: scale(1) translate(0, 0); opacity: 1; } 100% { transform: scale(0) translate(var(--tx), var(--ty)); opacity: 0; } }
    </style>
</head>
<body>

    <header>
        <div class="profile-mini">
            <div class="avatar" id="header-avatar">👤</div>
            <div>
                <div style="font-weight: 800; font-size: 15px;" id="header-username">Игрок</div>
                <div class="badge badge-player" id="header-badge">ИГРОК</div>
            </div>
        </div>
        <div class="wallet-amount"><span id="balance">0</span> ₽</div>
    </header>

    <!-- ВКЛАДКА: ГЕНЕРАТОР -->
    <div id="tab-generator" class="tab-content active">
        <div class="gacha-container">
            <div class="rarity-badge" id="rarity-badge" style="visibility: hidden;">ОБЫЧНЫЙ</div>
            <div class="plate-wrapper">
                <div class="license-plate" id="plate">
                    <div class="plate-main">
                        <span class="letters" id="l1">-</span><span id="num">---</span><span class="letters" id="l2">--</span>
                    </div>
                    <div class="plate-region">
                        <div class="region-code" id="region">--</div>
                        <div class="rus-box"><span>RUS</span><div class="flag"></div></div>
                    </div>
                </div>
            </div>
            <div style="font-size: 28px; font-weight: 900; margin-top: 25px; height: 35px;" id="price-display"></div>
        </div>

        <div class="action-buttons" id="actions">
            <button class="btn btn-sell" onclick="sellPlate()">Продать</button>
            <button class="btn btn-keep" onclick="keepPlate()">В гараж</button>
        </div>

        <button class="btn-spin-main" id="spin-btn" onclick="startSpin()">Сгенерировать</button>
    </div>

    <!-- ВКЛАДКА: ГАРАЖ -->
    <div id="tab-garage" class="tab-content">
        <h2 style="margin-bottom: 20px; width: 100%; max-width: 400px;">Мой Гараж</h2>
        <div id="garage-list" class="garage-grid"></div>
    </div>

    <!-- ВКЛАДКА: ТОПЫ -->
    <div id="tab-top" class="tab-content">
        <div class="top-switcher">
            <div class="top-tab active" onclick="switchTopMode('money')">По балансу</div>
            <div class="top-tab" onclick="switchTopMode('plates')">По номеру</div>
        </div>
        <div class="leaderboard-list" id="leaderboard-list"></div>
    </div>

    <!-- ВКЛАДКА: ПРОФИЛЬ -->
    <div id="tab-profile" class="tab-content">
        <div class="profile-card">
            <div class="profile-avatar-big" id="profile-avatar">👤</div>
            <h2 id="profile-name" style="margin-bottom: 5px;">Игрок</h2>
            <div class="badge badge-player" id="profile-badge" style="margin-bottom: 20px;">ИГРОК</div>
            
            <h3 style="align-self: flex-start; margin-bottom: 10px; font-size: 14px; color: #a1a1aa;">Установленный номер:</h3>
            <div class="plate-wrapper" style="transform: scale(0.85); transform-origin: top center; margin-bottom: -10px;">
                <div class="license-plate" id="profile-equipped-plate">
                    <div class="plate-main"><span class="letters">--</span><span id="num">---</span><span class="letters">--</span></div>
                    <div class="plate-region"><div class="region-code">--</div><div class="rus-box"><span>RUS</span><div class="flag"></div></div></div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-val" id="stat-spins">0</div>
                    <div class="stat-label">Прокруток</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="stat-garage">0/20</div>
                    <div class="stat-label">Автопарк</div>
                </div>
            </div>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <nav>
        <div class="nav-item active" onclick="switchTab('generator', this)"><i class="fa-solid fa-dice"></i><span>Генератор</span></div>
        <div class="nav-item" onclick="switchTab('garage', this)"><i class="fa-solid fa-warehouse"></i><span>Гараж</span></div>
        <div class="nav-item" onclick="switchTab('top', this)"><i class="fa-solid fa-trophy"></i><span>Рейтинг</span></div>
        <div class="nav-item" onclick="switchTab('profile', this)"><i class="fa-solid fa-user"></i><span>Профиль</span></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Настройки пользователя (Проверка на Creator)
        const CREATOR_ID = 5536519351;
        let isCreator = false;
        let userName = "Игрок";
        let userAvatar = "👤";

        if (tg.initDataUnsafe?.user) {
            userName = tg.initDataUnsafe.user.first_name;
            userAvatar = userName.charAt(0).toUpperCase();
            if (tg.initDataUnsafe.user.id === CREATOR_ID) {
                isCreator = true;
            }
        }

        // Состояние
        let player = {
            balance: parseInt(localStorage.getItem('g3_balance')) || 0,
            spins: parseInt(localStorage.getItem('g3_spins')) || 0,
            equippedPlateIndex: parseInt(localStorage.getItem('g3_equipped')) || -1,
            garage: JSON.parse(localStorage.getItem('g3_garage')) || []
        };
        let currentPlate = null;

        // Базы
        const letters = ['А', 'В', 'Е', 'К', 'М', 'Н', 'О', 'Р', 'С', 'Т', 'У', 'Х'];
        const premiumRegions = ['77', '99', '177', '777', '799'];
        const regularRegions = ['01', '50', '63', '78', '98', '123', '150', '190'];

        function rElem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function rInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function saveGame() {
            localStorage.setItem('g3_balance', player.balance);
            localStorage.setItem('g3_spins', player.spins);
            localStorage.setItem('g3_equipped', player.equippedPlateIndex);
            localStorage.setItem('g3_garage', JSON.stringify(player.garage));
            updateUI();
        }

        function updateUI() {
            document.getElementById('balance').innerText = player.balance.toLocaleString('ru-RU');
            document.getElementById('header-username').innerText = userName;
            document.getElementById('header-avatar').innerText = userAvatar;
            
            const badges = [document.getElementById('header-badge'), document.getElementById('profile-badge')];
            badges.forEach(b => {
                if(isCreator) {
                    b.className = 'badge badge-creator';
                    b.innerText = 'CREATOR';
                } else {
                    b.className = 'badge badge-player';
                    b.innerText = 'ИГРОК';
                }
            });

            // Обновление профиля
            document.getElementById('profile-name').innerText = userName;
            document.getElementById('profile-avatar').innerText = userAvatar;
            document.getElementById('stat-spins').innerText = player.spins;
            document.getElementById('stat-garage').innerText = `${player.garage.length}/20`;
            renderEquippedPlate();
            renderGarage();
            renderLeaderboard();
        }

        // --- GACHA МЕХАНИКА ---
        function rollRarity() {
            let roll = Math.random() * 100;
            if (roll > 99.2) return { id: 'LEGENDARY', name: 'ЛЕГЕНДАРНЫЙ', color: 'var(--legendary)' };
            if (roll > 95) return { id: 'MYTHIC', name: 'МИФИЧЕСКИЙ', color: 'var(--mythic)' };
            if (roll > 80) return { id: 'EPIC', name: 'ЭПИЧЕСКИЙ', color: 'var(--epic)' };
            if (roll > 60) return { id: 'RARE', name: 'РЕДКИЙ', color: 'var(--rare)' };
            return { id: 'COMMON', name: 'ОБЫЧНЫЙ', color: 'var(--common)' };
        }

        function generatePlateData(rarity) {
            let l1, l2, l3, num, reg, price;
            switch(rarity.id) {
                case 'LEGENDARY': l1=l2=l3=rElem(letters); let d=rInt(1,9); num=`${d}${d}${d}`; reg=rElem(premiumRegions); price=rInt(2000000, 15000000); break;
                case 'MYTHIC': if(Math.random()>0.5){l1=l2=l3=rElem(letters); num=rInt(1,999).toString().padStart(3,'0');}else{l1=rElem(letters);l2=rElem(letters);l3=rElem(letters);let d2=rInt(1,9);num=`${d2}${d2}${d2}`;} reg=rElem(premiumRegions); price=rInt(200000, 800000); break;
                case 'EPIC': l1=rElem(letters);l2=rElem(letters);l3=rElem(letters); num=rElem(['100','500','001','007']); reg=rElem([...premiumRegions, ...regularRegions]); price=rInt(50000, 150000); break;
                case 'RARE': l1=rElem(letters);l2=rElem(letters);l3=rElem(letters); let d3=rInt(0,9),d4=rInt(0,9); num=`${d3}${d4}${d3}`; reg=rElem(regularRegions); price=rInt(8000, 25000); break;
                default: l1=rElem(letters);l2=rElem(letters);l3=rElem(letters); num=rInt(11,999).toString().padStart(3,'0'); reg=rElem(regularRegions); price=rInt(1000, 4000); break;
            }
            return { l1, l2, l3, num, reg, price, rarity };
        }

        let isSpinning = false;
        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('spin-btn').style.display = 'none';
            document.getElementById('actions').classList.remove('visible');
            document.getElementById('price-display').innerText = '';
            document.getElementById('rarity-badge').style.visibility = 'hidden';
