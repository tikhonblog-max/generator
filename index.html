<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Генератор Номеров GLOBAL 7.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap');
        
        :root {
            --bg: #09090b; --panel: rgba(24, 24, 27, 0.75); --text: #ffffff;
            --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
            --common: #a1a1aa; --rare: #4ade80; --epic: #c084fc; --mythic: #f87171; --legendary: #fbbf24;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; background-image: radial-gradient(circle at 50% 0%, #1e1e24 0%, #09090b 70%); }

        /* Шапка */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--panel); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 50; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, var(--primary), #8b5cf6); display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 18px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);}
        .balance-val { font-size: 22px; font-weight: 900; color: var(--success); letter-spacing: 0.5px;}

        /* Вкладки */
        .tab-content { flex: 1; display: none; flex-direction: column; align-items: center; padding: 20px; padding-bottom: 100px; overflow-y: auto; }
        .tab-content.active { display: flex; animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Выбор страны */
        .country-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; width: 100%; max-width: 400px; }
        .country-scroll::-webkit-scrollbar { display: none; }
        .country-tab { padding: 10px 16px; background: rgba(255,255,255,0.05); border-radius: 12px; font-weight: 700; font-size: 14px; color: #a1a1aa; white-space: nowrap; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
        .country-tab.active { background: rgba(59, 130, 246, 0.15); color: #fff; border-color: var(--primary); }

        /* Контроль Автокрута */
        .auto-spin-panel { width: 100%; max-width: 380px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 15px; margin-bottom: 25px; }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .toggle-label { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3f3f46; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }
        input:disabled + .slider { opacity: 0.5; }

        .threshold-row { display: flex; justify-content: space-between; align-items: center; opacity: 0.5; transition: 0.3s; pointer-events: none;}
        .threshold-row.active { opacity: 1; pointer-events: auto; }
        .threshold-select { background: #18181b; color: #fff; border: 1px solid #3f3f46; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; outline: none; }

        /* Дизайн номера */
        .plate-wrapper { position: relative; width: 100%; max-width: 380px; perspective: 1000px; }
        .license-plate { display: flex; background: #fff; color: #000; border-radius: 10px; height: 85px; width: 100%; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px #000, 0 10px 25px rgba(0,0,0,0.5); transition: all 0.15s; }
        .license-plate.spinning { transform: scale(0.95) rotateX(10deg); filter: blur(2px); }
        
        .plate-main { flex: 3; display: flex; justify-content: center; align-items: center; font-size: 48px; font-weight: 900; letter-spacing: 1px; }
        .plate-main .letters { font-size: 34px; margin: 0 4px; font-weight: 600; }
        .plate-region { flex: 1; border-left: 2px solid #000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 5px; }
        .region-code { font-size: 32px; font-weight: 900; line-height: 0.9; }
        .country-box { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 900; margin-top: 4px; }
        .flag { width: 20px; height: 13px; border: 1px solid #000; }
        
        .f-ru { background: linear-gradient(180deg, #fff 33%, #0039a6 33%, #0039a6 66%, #d52b1e 66%); }
        .f-kz { background: #00afaa; position: relative; } .f-kz::after { content: ''; position: absolute; top: 3px; left: 7px; width: 4px; height: 4px; background: #fec500; border-radius: 50%; }
        .f-by { background: linear-gradient(180deg, #d52b1e 66%, #009739 66%); border-left: 4px solid #fff; }
        .f-uz { background: linear-gradient(180deg, #0099b5 30%, #fff 30%, #fff 35%, #ce1126 35%, #ce1126 40%, #fff 40%, #fff 60%, #ce1126 60%, #ce1126 65%, #fff 65%, #fff 70%, #1eb53a 70%); }
        .f-kg { background: #e2001a; position: relative; } .f-kg::after { content: ''; position: absolute; top: 3px; left: 7px; width: 4px; height: 4px; background: #ffea00; border-radius: 50%; }

        .rarity-badge { padding: 6px 18px; border-radius: 20px; font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-top: 20px; background: rgba(0,0,0,0.5); border: 1px solid var(--common); visibility: hidden; }
        .val-display { font-size: 28px; font-weight: 900; margin-top: 10px; height: 35px; visibility: hidden; }

        /* Кнопки */
        .controls-container { width: 100%; max-width: 380px; margin-top: auto; position: relative; height: 60px; }
        
        .btn-spin-main { position: absolute; width: 100%; height: 100%; background: #fff; color: #000; border-radius: 16px; font-weight: 900; font-size: 16px; text-transform: uppercase; border: none; box-shadow: 0 4px 20px rgba(255,255,255,0.2); cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; z-index: 2; }
        .btn-spin-main:active { transform: scale(0.96); }
        .btn-spin-main.auto-active { background: var(--warning); box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4); animation: pulse 1.5s infinite; }
        .btn-spin-main:disabled { filter: grayscale(1); opacity: 0.7; pointer-events: none; }
        .spin-cost { background: rgba(0,0,0,0.1); padding: 4px 8px; border-radius: 8px; font-size: 13px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.98); } 100% { transform: scale(1); } }

        .decision-actions { position: absolute; width: 100%; height: 100%; display: flex; gap: 10px; z-index: 1; opacity: 0; pointer-events: none; transition: 0.3s; }
        .decision-actions.visible { z-index: 3; opacity: 1; pointer-events: auto; }
        
        .btn { flex: 1; border-radius: 16px; font-weight: 900; font-size: 14px; border: none; cursor: pointer; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn-sell { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .btn-sell span { color: var(--success); font-size: 12px; }
        .btn-keep { background: var(--primary); color: #fff; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }

        /* Гараж */
        .garage-grid { display: grid; grid-template-columns: 1fr; gap: 15px; width: 100%; max-width: 400px; }
        .garage-item { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; align-items: center; }
        .garage-item .license-plate { transform: scale(0.9); margin-bottom: 5px; height: 80px; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px #000; }
        .garage-info { width: 100%; display: flex; justify-content: space-between; margin-bottom: 12px; padding: 0 10px; }
        .btn-sell-garage { width: 100%; padding: 12px; background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* Навигация */
        nav { position: fixed; bottom: 0; width: 100%; background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 12px 0 20px 0; border-top: 1px solid rgba(255,255,255,0.05); z-index: 100; }
        .nav-item { color: #71717a; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; transition: 0.2s; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <header>
        <div class="user-info">
            <div class="avatar" id="avatar">👤</div>
            <div style="font-weight: 800; font-size: 15px;" id="username">Игрок</div>
        </div>
        <div class="balance-val"><span id="balance">0</span> ₽</div>
    </header>

    <div id="tab-generator" class="tab-content active">
        <div class="country-scroll">
            <div class="country-tab active" onclick="setCountry('RU')">🇷🇺 RU</div>
            <div class="country-tab" onclick="setCountry('KZ')">🇰🇿 KZ</div>
            <div class="country-tab" onclick="setCountry('BY')">🇧🇾 BY</div>
            <div class="country-tab" onclick="setCountry('UZ')">🇺🇿 UZ</div>
            <div class="country-tab" onclick="setCountry('KG')">🇰🇬 KG</div>
        </div>

        <div class="auto-spin-panel">
            <div class="toggle-row">
                <div class="toggle-label"><i class="fa-solid fa-bolt" style="color:var(--warning)"></i> Авто-Прокрут</div>
                <label class="switch">
                    <input type="checkbox" id="auto-spin-toggle" onchange="toggleAutoSpinSettings()">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="threshold-row" id="threshold-row">
                <span style="font-size: 12px; font-weight: 600; color:#a1a1aa;">Остановка от:</span>
                <select class="threshold-select" id="auto-spin-threshold">
                    <option value="1500">1 500 ₽ (Редкие+)</option>
                    <option value="10000">10 000 ₽ (Эпик+)</option>
                    <option value="50000">50 000 ₽ (Мифик+)</option>
                </select>
            </div>
        </div>

        <div class="plate-wrapper">
            <div class="license-plate" id="plate"></div>
        </div>
        <div class="rarity-badge" id="rarity-badge">ОБЫЧНЫЙ</div>
        <div class="val-display" id="val-display">0 ₽</div>

        <div class="controls-container">
            <button class="btn-spin-main" id="btn-generate" onclick="handleSpinClick()">
                <span id="spin-btn-text">Крутить</span> <span class="spin-cost" id="spin-cost-badge">-500 ₽</span>
            </button>
            
            <div class="decision-actions" id="decision-actions">
                <button class="btn btn-sell" id="btn-sell" onclick="sellPlate()">Продать <span id="sell-price-btn">+0 ₽</span></button>
                <button class="btn btn-keep" id="btn-keep" onclick="keepPlate()">В гараж</button>
            </div>
        </div>
    </div>

    <div id="tab-garage" class="tab-content">
        <h2 style="margin-bottom: 20px; font-weight: 900;">ГАРАЖ (<span id="garage-count">0</span>/20)</h2>
        <div id="garage-list" class="garage-grid"></div>
    </div>

    <nav>
        <div class="nav-item active" onclick="switchTab('generator', this)"><i class="fa-solid fa-dice"></i><span>Рулетка</span></div>
        <div class="nav-item" onclick="switchTab('garage', this)"><i class="fa-solid fa-warehouse"></i><span>Гараж</span></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        if (tg.initDataUnsafe?.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
            document.getElementById('avatar').innerText = tg.initDataUnsafe.user.first_name.charAt(0).toUpperCase();
        }

        // --- CRYPTOGRAPHIC RNG (АБСОЛЮТНЫЙ РАНДОМ) ---
        function secureRandom() {
            const array = new Uint32Array(1);
            window.crypto.getRandomValues(array);
            return array[0] / (0xFFFFFFFF + 1); // Возвращает число от 0.0 до 0.999...
        }
        function rElem(arr) { return arr[Math.floor(secureRandom() * arr.length)]; }
        function rInt(min, max) { return Math.floor(secureRandom() * (max - min + 1)) + min; }

        // --- ЭКОНОМИКА И ЗАЩИТА (ANTI-DUPE) ---
        const SPIN_COST = 500;
        let player = {
            balance: localStorage.getItem('gn_v7_balance') ? parseInt(localStorage.getItem('gn_v7_balance')) : 15000,
            garage: JSON.parse(localStorage.getItem('gn_v7_garage')) || []
        };
        let currentCountry = 'RU';
        let generatedPlate = null;
        
        // Mutex Locks для блокировки двойных кликов
        let actionLock = false; 
        let isAutoSpinning = false;
        let autoSpinTimeout = null;

        function saveGame() {
            localStorage.setItem('gn_v7_balance', player.balance);
            localStorage.setItem('gn_v7_garage', JSON.stringify(player.garage));
            document.getElementById('balance').innerText = player.balance.toLocaleString('ru-RU');
        }

        const regions = {
            'RU': [...Array.from({length: 99}, (_, i) => (i + 1).toString().padStart(2, '0')), '102','116','123','150','177','178','190','199','750','777','799'],
            'KZ': Array.from({length: 20}, (_, i) => (i + 1).toString().padStart(2, '0')),
            'BY': ['1','2','3','4','5','6','7'],
            'UZ': Array.from({length: 25}, (_, i) => (i + 1).toString().padStart(2, '0')),
            'KG': ['01','02','03','04','05','06','07','08','09']
        };
        const letters = {
            'RU': ['А','В','Е','К','М','Н','О','Р','С','Т','У','Х'],
            'KZ': 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
            'BY': ['A','B','C','E','H','I','K','M','O','P','T','X'],
            'UZ': 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
            'KG': 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')
        };

        function toggleAutoSpinSettings() {
            if (actionLock) return; // Блокировка переключений во время обработки
            const isChecked = document.getElementById('auto-spin-toggle').checked;
            const row = document.getElementById('threshold-row');
            if (isChecked) {
                row.classList.add('active');
            } else {
                row.classList.remove('active');
                if(isAutoSpinning) stopAutoSpin();
            }
        }

        function setCountry(code) {
            if (actionLock || isAutoSpinning) {
                tg.showAlert("Сначала завершите текущее действие!");
                return; 
            }
            currentCountry = code;
            document.querySelectorAll('.country-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            resetUI();
            renderEmptyPlate();
        }

        function renderEmptyPlate() {
            const plate = document.getElementById('plate');
            const c = currentCountry;
            let html = '';
            if(c === 'RU') html = `<div class="plate-main"><span class="letters">-</span><span>---</span><span class="letters">--</span></div><div class="plate-region"><div class="region-code">--</div><div class="country-box"><span>RUS</span><div class="flag f-ru"></div></div></div>`;
            if(c === 'KZ') html = `<div class="plate-main"><span>---</span><span class="letters">---</span></div><div class="plate-region"><div class="region-code">--</div><div class="country-box"><span>KZ</span><div class="flag f-kz"></div></div></div>`;
            if(c === 'BY') html = `<div class="plate-main"><span>----</span><span class="letters" style="margin-left:10px;">--</span></div><div class="plate-region" style="border:none;"><div class="region-code" style="font-size:24px;">-</div><div class="country-box"><span>BY</span><div class="flag f-by"></div></div></div>`;
            if(c === 'UZ') html = `<div class="plate-main"><span>---</span><span class="letters">---</span></div><div class="plate-region"><div class="region-code">--</div><div class="country-box"><span>UZ</span><div class="flag f-uz"></div></div></div>`;
            if(c === 'KG') html = `<div class="plate-main"><span>---</span><span class="letters">---</span></div><div class="plate-region"><div class="region-code">--</div><div class="country-box"><span>KG</span><div class="flag f-kg"></div></div></div>`;
            plate.innerHTML = html;
        }

        function rollRarity() {
            let r = secureRandom() * 100;
            if (r > 99.3) return { id: 'LEGENDARY', name: 'ЛЕГЕНДАРНЫЙ', color: 'var(--legendary)' };
            if (r > 96) return { id: 'MYTHIC', name: 'МИФИЧЕСКИЙ', color: 'var(--mythic)' };
            if (r > 85) return { id: 'EPIC', name: 'ЭПИЧЕСКИЙ', color: 'var(--epic)' };
            if (r > 60) return { id: 'RARE', name: 'РЕДКИЙ', color: 'var(--rare)' };
            return { id: 'COMMON', name: 'ОБЫЧНЫЙ', color: 'var(--common)' };
        }

        function createPlate() {
            const rarity = rollRarity();
            let d = rInt(1,9), num = '', l = '', l1, l2, l3;
            let reg = rElem(regions[currentCountry]);
            let price = 0; let html = '';
            const letArr = letters[currentCountry];

            if(rarity.id === 'LEGENDARY') price = rInt(500000, 2000000);
            else if(rarity.id === 'MYTHIC') price = rInt(50000, 200000);
            else if(rarity.id === 'EPIC') price = rInt(10000, 30000);
            else if(rarity.id === 'RARE') price = rInt(1500, 5000);
            else price = rInt(100, 300);

            if(currentCountry === 'RU') {
                if(rarity.id === 'LEGENDARY') { l1=l2=l3=rElem(letArr); num=`${d}${d}${d}`; }
                else if(rarity.id === 'EPIC') { l1=rElem(letArr);l2=l3=rElem(letArr); num=rElem(['100','500','001']); }
                else if(rarity.id === 'RARE') { l1=rElem(letArr);l2=rElem(letArr);l3=rElem(letArr); let mx=rInt(0,9); num=`${mx}${rInt(0,9)}${mx}`; }
                else { l1=rElem(letArr);l2=rElem(letArr);l3=rElem(letArr); num=rInt(11,999).toString().padStart(3,'0'); }
                html = `<div class="plate-main"><span class="letters">${l1}</span><span>${num}</span><span class="letters">${l2}${l3}</span></div><div class
